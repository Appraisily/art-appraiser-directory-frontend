worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile        on;
  keepalive_timeout  65;

  server {
    # Explicit favicon handling to avoid stale redirects/caches
    location = /favicon.ico {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    location = /favicon.svg {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Canonical static HTML is the production surface. Inject the governed
    # bootstrap before any legacy page/bundle telemetry executes.
    sub_filter_once on;
    sub_filter '<head>' '<head><script src="/assets/appraisily-directory-telemetry-20260828-v1.js" data-appraisily-directory-telemetry="v1"></script>';

    # All HTML routes inherit one no-store policy. Asset locations below
    # deliberately override this with immutable/public caching.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header cf-edge-cache "no-cache" always;
    add_header Pragma "no-cache" always;

    # Prevent nginx from leaking internal port/scheme in redirect Location headers.
    absolute_redirect off;
    port_in_redirect off;

    index index.html;

    error_page 404 /404.html;
    error_page 410 =410 /410.html;

    location = /404.html {
      internal;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # The corrective artifact includes a dedicated retired-location document.
    # Older rollback artifacts do not, so fall back to their existing branded
    # 404 document while preserving the original terminal 410 status.
    location = /410.html {
      internal;
      try_files $uri /404.html =410;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Restore the standalone Art host. Public hubs, feeds, and the reviewed
    # city/provider cohort are served here. Unknown routes stay terminal.
    location = /appraiser { return 301 /appraiser/$is_args$args; }
    location = /location { return 301 /location/$is_args$args; }
    location = /methodology { return 301 /methodology/$is_args$args; }
    location = /get-listed { return 301 /get-listed/$is_args$args; }

    # This marker ships with the reviewed artifact. Keeping enforcement
    # artifact-gated prevents a config-only container restart from changing an
    # older active release before the reviewed release is promoted.
    location = /.reviewed-route-enforcement-v2 {
      internal;
    }

    # Only the reviewed art-only city pages may serve location HTML.
    location ~ ^/location/(addison|albuquerque|arlington|aspen|atlanta|austin|baltimore|beverly-hills|boston|buffalo|charleston|charlotte|chicago|cincinnati|cleveland|colleyville|colorado-springs|columbus|dallas|denver|detroit|el-paso|fort-worth|fresno|hartford|houston|indianapolis|jacksonville|jacksonville-beach|kansas-city|lancaster|langley|las-vegas|long-beach|los-angeles|louisville|memphis|mesa|miami|milwaukee|minneapolis|nashville|new-orleans|new-york|oakland|oklahoma-city|omaha|orlando|palm-beach|philadelphia|phoenix|pittsburgh|portland|providence|raleigh|ranchos-de-taos|redondo-beach|richmond|rockville|sacramento|salt-lake-city|san-antonio|san-diego|san-francisco|san-jose|santa-fe|savannah|schaumburg|seattle|solana-beach|st-louis|tampa|tucson|tulsa|virginia-beach|washington-dc|wichita|woodside)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/location/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/location/[^/]+/?$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri $uri/index.html =404;
    }

    # Published verified and limited provider profiles.
    location ~ ^/appraiser/(812-maplewood|a-and-a-art-appraisals-naples-fl|a-z-appraisal-and-estate-consultants|aa-fine-art-art-appraiser-in-boca-raton-and-palm-beach|aaron-appraisal-services-art-appraisal-antiques-appraisal-art-appraiser-antiques-appraiser|abd-antique-appraisers|abh-fine-art-advisory|adelaide-fine-art|afa-fine-art|afp-art-consulting-llc-fine-art-consulting-appraisals-research-writing-and-collections-man|aitchison-fine-art-advisory|alexander-appraisal-and-estate-services|alicia-e-weaver-isa-capp|alicia-weaver|allison-gee-fine-art-appraisals|allrich-fine-art-services|alta-fine-art-advisory-and-appraisal|american-society-of-appraisers-asa|amy-i-schlegel|anderson-campbell-art-appraisals|anderson-fine-art-appraisals|andrea-moody-fine-art-appraisals-llc|anne-kelly-lewis|antique-and-estate-buyers|antique-and-fine-art-appraisal|antique-and-fine-art-appraisals|antique-appraisel-and-estate-sale-service-k-and-p-bailey-isa-capp-aaa|antique-art-buyers|anya-foo---nova-art-la|appraisal-services-philadelphia-pa-art-antiques-furniture-estate|appraisalink-for-art-and-antiques|appraisals-miami-fl-estate-and-appraisal-services-inc|appraisals-of-value|arnoult-fine-art|art-and-antiques-appraisal-services-llc|art-appraisal-services-llc|art-appraisals-of-new-england|art-asset-management-group|art-directives|art-fortune-llc|art-leaders-gallery-fine-art-appraisals|art-peritus|art-preservation-services-michigan|art-services-2000-ltd-fine-art-appraisals|art-world-appraisals-phd|artemappraisals|artrium-appraisal-elizabeth-krambeer|artrium-fine-art-and-estate-appraisal|ashleigh-caroline-associates-inc|austin-christian-fine-art|austin-galleries|austin-national-appraisal-partners-llp|avalon-antiques-appraisals-and-estate-services|avant-garde|b-langston-estate-liquidation|baker-appraisers-asian-antique-appraisers|barry-s-slosberg-auctioneers-and-appraisers|bernard-ewell-fine-at-appraisals-llc|bertolino-arts|beth-weingast-fine-art-appraisals)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/(betsy-dorminy-appraisals|bonhams-pacific-northwest|borodin-fine-art-appraisals|boston-boston-appraisal-services|boston-poras-fine-arts-appraiser-meeting-all-your-fine-art-appraisal-needs|bravado-fine-arts|brenda-simonson-mohle|butenhoff-fine-art-and-appraisal|cain-fine-art|cambridge-appraisals|capital-art-group-art-appraisals-personal-property-appraisals-appraisal-reviews-expert-wit|carla-young-fine-arts-appraisals-appraisals-and-consultations|carrie-young|case-antiques-inc-auctions-appraisals|castner-values|charles-barry-goldstein|charles-pharr-certified-appraiser|cheney-appraisal-services|chris-ingalls|christine-guernsey|christine-h-anderson-isa-am|coast2coast-auctions|collector-s-fine-art-appraisal-et-associates|connecticut-art-appraisals-llc-alizzandra-danker|czudej-mcdonough|dana-summitt-look-appraisal-llc|david-dike-fine-art|detroit-fine-art-appraisals|detroit-marketrend-appraisals|dina-brown|dina-brown-art-appraisals|dow-art-galleries|doyle-pennsylvania-regional-office|drake-appraisals|dudley-certified-appraisers-art-antiques-and-estates|dumouchelles|duwamps-appraisals|edward-kitson|edward-m-stanley-appraisal-services-fine-art-antiques|eisele-gallery|elise-waters-olonia|elizabeth-abston-llc|elizabeth-lake-lovett|elizabeth-lovett|elizabeth-wells-appraisals-and-fine-art-services|emmett-appraisal-consulting-group|ena-art-group|erika-holycross-prestige-estate-services|erin-e-keever|escher-associates-ea|everard-auctions-appraisals|fine-art-antique-furniture-and-jewelry-appraiser-in-los-angeles-ca-stuart-h-salsbury-appra|fine-art-appraisal-services|fine-art-concierge|fine-arts-services|fox-white-art-and-antique-appraisals-nyc|frances-redell-white-appraisal-consultant-services|fruitcocktail-collectables|full-service-estate-sales-and-appraisals-houston-accredited-appraiser|gabrielle-segal-gs-art-concierge)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/(gb-fine-art-professional-art-appraisals-chicago-illinois|geolat|giardina-fine-art-appraisal-services|gilded-pear-gallery|green-donation-consultants|greg-c-brown|gurr-johns|hale-appraisals|haney-appraisals-in-fine-art|harrison-appraisals-llc-appraisal-firm-westminster-md|heidi-vaughan-ma-isa-am|heritage-appraisals|heritage-fine-art-appraisers|hill-art|historic-art-services|hkpowerstudio|hollingsworth-fine-a|home-foltz-fine-art|houston-estate-sales-and-auction-company|houston-houston-estate-sales-and-appraisals|hudson-valley-new-york-pennsylvania-new-jersey-antique-and-art-appraisers|intermountain-appraisal|isabelle-m-weiss|jacksonville-fine-art-appraisers|jacksonville-stellers-gallery|james-b-hand-fine-art-19th-and-20th-century-american-art-appraisals|janet-l-ross|jason-preston-art-advisory-appraisals|jennifer-e-salvetti-kulla-ma|jennifer-l-stoots-aaa-certified-phototgraphy-and-art-appraiser|jennifer-l-strasbaugh-fine-arts-appraising|jessica-berger|jlfineartappraisal|josefa-gonzalez-mariscal-fine-art|jrl-fine-art-appraisal|jsk-fine-art-appraisals|julia-r-bluett|justin-rogers|kagan-fine-art-appraisals|kaminski-auctions|kathy-poppers-expert-art-appraisals|kelly-cahn-art-advisory-appraisals|kim-a-kasten|kinzelman-art-consulting|konda-fine-art-appraisals|kurt-shaw-company|lamplighter-appraisal-service-personal-property-appraisal-san-diego|lancaster-appraisals|lauren-k-stump|lauren-travis-art-appraiser|lena-s-appraisal-services|leprince-fine-art|lg-appraisal|lindsey-m-owen|lisa-austin-laa|liz-anders-associates|look-appraisal|loro-fine-art-restoration-and-appraisal|lost-art-gallery|m-k-g-art-management-art-advisors-and-appraisers-houston-texas)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/(madison-group-fine-art-appraisals|maloney-fine-art|manhattan-fine-art-appraisers|manzi-personal-property-appraisers|maria-tarrence|matthew-clayton-brown-fine-art-appraisers|mcdade-fine-art-appraisals|melanie-modica-modica-fine-art|metropolitan-art-appraisers|michael-rose-fine-art|mimesis-gallery|mjp-art-services|momaa-museum-of-modern-american-art|museum-exchange|myriam-nader-salomon-myriam-nader-haitian-art-gallery|native-american-art-appraisals|new-orleans-auction-galleries|new-york-fine-art-appraisers|new-york-poras-fine-arts-appraiser-meeting-all-your-fine-art-appraisal-needs|newton-fine-art-appraisal|nh-auctions-and-appraisals|open-to-the-public|orchestrated-artwork|page-art-inc|perri-guthrie|peter-held-art-appraisals-associates|poras-fine-arts-appraiser-meeting-all-your-fine-art-appraisal-needs|prestige-estate-services|prestige-estate-services-team|ralph-deluca|revere-auctions|richard-beau-lieu-and-associates-fine-art-appraisers|rlc-appraisals|robyn-roderick-fine-art-appraisal-services-llc|rocky-mountain-art-appraisal-group|rosalie-wardell|ruffner-art-advisory|s-cohen-fine-art-restorers-and-appraisers-of-19th-and-20th-century-french-continental-and|sarah-ann-wilson-art-services|savvy-collector|saylor-rice-appraisals|schlegel-fine-art-consulting-llc|scholz-appraisals-and-advisory-fine-art-and-estate-appraisals|schultz-auctioneers|schwarz-gallery|selz-fine-arts-appraisals|shelley-hall-bend-art-appraisals|silvia-waltner-fine-art-services-art-appraisals-and-advisory|skinner-boston-bonhams|soltesz-fine-art|southwest-art-appraisals|spalding-nix-fine-art|st-lifer-art-inc-international-art-appraiser|stanford-fine-art|stephanie-calman|stephen-g-frazier-fine-art-appraiser-llc|strata-fine-art-services|susan-golashovsky-personal-property-appraiser|sylvia-fraley-fine-art-appraisals|tenhagen-appraisals)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/(the-antique-guy|the-fine-art-group|the-perfect-piece-atlanta|thompson-and-martinez-fine-art-appraisals-inc|valia-garzon-art-services|vallot-auctioneers|van-weyenbergh-fine-art|veritas-fine-art-and-appraisals|victoria-shaw-art-appraisals-advisory|vivanco-art-and-appraisals|washington-fine-art-appraisers|william-s-stamats|williams-fine-art-gallery|winston-art-group-palm-beach|winter-associates|woodard-lipe-fine-art-auction|wyeth-appraisals)/?$ {
      try_files $uri $uri/index.html =404;
    }
    # Reviewed historical aliases have no published equivalent destination.
    location ~ ^/appraiser/(amelia-jeffers-auctioneers-appraisers|appraiseitnow-louisiana|artifactual-history-appraisal|boston-adelaide-fine-art|djr-authentication-lc|escher-associates-nancy-escher|fine-art-appraisals-new-york|philadelphia-art-of-estates-personal-property-appraisal-firm|prestige-estate-services-brenda-blackmon|prestige-estate-services-elizabeth-lovett-stephanie-calman|prestige-estate-services-national-network|redtail-appraisals-rebekah-assid)/?$ {
      error_page 410 =410 /appraiser-unavailable.html;
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 410; }
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/appraiser/[^/]+/?$ {
      error_page 404 =404 /appraiser-unavailable.html;
      error_page 418 =200 /appraiser-unavailable.html;
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri $uri/index.html =418;
    }

    # Serve built assets directly; never rewrite to index.html
    location ^~ /assets/ {
      # If file doesn't exist, return 404 (do not fall back to index.html)
      try_files $uri =404;
      # Aggressive caching for hashed assets
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Some canonical assets intentionally live under this public prefix.
    location ^~ /directory/assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Serve common static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    # Do not cache HTML documents to avoid stale index.html pointing to old chunk names.
    # IMPORTANT: do not fall back to /index.html for missing files (prevents soft-404 indexing traps).
    location ~* \.html$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # Strict static routing: known directories resolve their index.html; unknown
    # documents preserve HTTP 404 and use the branded error page above.
    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # Redirect WordPress content to resources subdomain
    location ^~ /wp-content/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Redirect WordPress admin to resources subdomain
    location ^~ /wp-admin/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Canonicalize singular to plural: /appraisal/<id> → https://appraisily.com/appraisals/<id>
    # Always emit the public HTTPS host to avoid leaking internal ports or schemes.
    location ~ ^/appraisal/([A-Za-z0-9-]+)/?$ {
      return 301 https://appraisily.com/appraisals/$1$is_args$args;
    }

    gzip on;
    gzip_types text/plain application/xml text/css text/javascript application/javascript application/json;
  }
}
