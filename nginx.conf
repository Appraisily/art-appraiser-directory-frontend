worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile        on;
  keepalive_timeout  65;

  server {
    # Explicit favicon handling to avoid stale redirects/caches
    location = /favicon.ico {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    location = /favicon.svg {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Canonical static HTML is the production surface. Inject the governed
    # bootstrap before any legacy page/bundle telemetry executes.
    sub_filter_once on;
    sub_filter '<head>' '<head><script src="/assets/appraisily-directory-telemetry-20260804-v1.js" data-appraisily-directory-telemetry="v1"></script>';

    # All HTML routes inherit one no-store policy. Asset locations below
    # deliberately override this with immutable/public caching.
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Cloudflare-CDN-Cache-Control "no-store" always;
    add_header cf-edge-cache "no-cache" always;
    add_header Pragma "no-cache" always;

    # Prevent nginx from leaking internal port/scheme in redirect Location headers.
    absolute_redirect off;
    port_in_redirect off;

    index index.html;

    error_page 404 /404.html;
    error_page 410 =410 /410.html;

    location = /404.html {
      internal;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # The corrective artifact includes a dedicated retired-location document.
    # Older rollback artifacts do not, so fall back to their existing branded
    # 404 document while preserving the original terminal 410 status.
    location = /410.html {
      internal;
      try_files $uri /404.html =410;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Restore the standalone Art host. Public hubs, feeds, and the reviewed
    # city/provider cohort are served here. Unknown routes stay terminal.
    location = /appraiser { return 301 /appraiser/$is_args$args; }
    location = /location { return 301 /location/$is_args$args; }
    location = /methodology { return 301 /methodology/$is_args$args; }
    location = /get-listed { return 301 /get-listed/$is_args$args; }

    # This marker ships with the reviewed artifact. Keeping enforcement
    # artifact-gated prevents a config-only container restart from changing an
    # older active release before the reviewed release is promoted.
    location = /.reviewed-route-enforcement-v2 {
      internal;
    }

    # Only the reviewed art-only city pages may serve location HTML.
    location ~ ^/location/(addison|albuquerque|arlington|aspen|atlanta|austin|baltimore|beverly-hills|boston|buffalo|charleston|charlotte|chicago|cincinnati|cleveland|colleyville|colorado-springs|columbus|dallas|denver|detroit|el-paso|fort-worth|fresno|hartford|houston|indianapolis|jacksonville|jacksonville-beach|kansas-city|lancaster|langley|las-vegas|long-beach|los-angeles|louisville|memphis|mesa|miami|milwaukee|minneapolis|nashville|new-orleans|new-york|oakland|oklahoma-city|omaha|orlando|palm-beach|philadelphia|phoenix|pittsburgh|portland|providence|raleigh|ranchos-de-taos|redondo-beach|richmond|rockville|sacramento|salt-lake-city|san-antonio|san-diego|san-francisco|san-jose|santa-fe|savannah|schaumburg|seattle|solana-beach|st-louis|tampa|tucson|tulsa|virginia-beach|washington-dc|wichita|woodside)/?$ {
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/location/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/location/[^/]+/?$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri $uri/index.html =404;
    }

    # Only the reviewed publication cohort may serve provider-specific HTML.
    location ~ ^/appraiser/(afp-art-consulting-llc-fine-art-consulting-appraisals-research-writing-and-collections-man|heidi-vaughan-ma-isa-am|open-to-the-public|st-lifer-art-inc-international-art-appraiser|sarah-ann-wilson-art-services)/?$ {
      try_files $uri $uri/index.html =404;
    }
    # Reviewed historical aliases have no published equivalent destination.
    location ~ ^/appraiser/(amelia-jeffers-auctioneers-appraisers|appraiseitnow-louisiana|artifactual-history-appraisal|boston-adelaide-fine-art|djr-authentication-lc|escher-associates-nancy-escher|fine-art-appraisals-new-york|philadelphia-art-of-estates-personal-property-appraisal-firm|prestige-estate-services-brenda-blackmon|prestige-estate-services-elizabeth-lovett-stephanie-calman|prestige-estate-services-national-network|redtail-appraisals-rebekah-assid)/?$ {
      error_page 410 =410 /appraiser-unavailable.html;
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 410; }
      try_files $uri $uri/index.html =404;
    }
    location ~ ^/appraiser/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/appraiser/[^/]+/?$ {
      error_page 404 =404 /appraiser-unavailable.html;
      error_page 418 =200 /appraiser-unavailable.html;
      if (-f $document_root/.reviewed-route-enforcement-v2) { return 404; }
      try_files $uri $uri/index.html =418;
    }

    # Serve built assets directly; never rewrite to index.html
    location ^~ /assets/ {
      # If file doesn't exist, return 404 (do not fall back to index.html)
      try_files $uri =404;
      # Aggressive caching for hashed assets
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Some canonical assets intentionally live under this public prefix.
    location ^~ /directory/assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Serve common static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    # Do not cache HTML documents to avoid stale index.html pointing to old chunk names.
    # IMPORTANT: do not fall back to /index.html for missing files (prevents soft-404 indexing traps).
    location ~* \.html$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # Strict static routing: known directories resolve their index.html; unknown
    # documents preserve HTTP 404 and use the branded error page above.
    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # Redirect WordPress content to resources subdomain
    location ^~ /wp-content/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Redirect WordPress admin to resources subdomain
    location ^~ /wp-admin/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Canonicalize singular to plural: /appraisal/<id> → https://appraisily.com/appraisals/<id>
    # Always emit the public HTTPS host to avoid leaking internal ports or schemes.
    location ~ ^/appraisal/([A-Za-z0-9-]+)/?$ {
      return 301 https://appraisily.com/appraisals/$1$is_args$args;
    }

    gzip on;
    gzip_types text/plain application/xml text/css text/javascript application/javascript application/json;
  }
}
