    # Bind canonical aliases to the reviewed artifact. Older rollback trees
    # retain their existing routing when recreated with this staged config.
    set $art_release_canonical_alias "";
    if (-f $document_root/.canonical-route-redirects-v1) {
      set $art_release_canonical_alias $art_canonical_alias;
    }
    if ($art_release_canonical_alias) {
      return 301 $art_release_canonical_alias$is_args$args;
    }
    location = /.canonical-route-redirects-v1 {
      internal;
    }

    # Canonical static HTML is the production surface. Inject the governed
    # bootstrap before any legacy page/bundle telemetry executes.
    sub_filter_once on;
    sub_filter '<head>' '<head><script src="/assets/appraisily-directory-telemetry-20261001-v3.js" data-appraisily-directory-telemetry="v1"></script>';

