worker_processes  1;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  server {
    # Explicit favicon handling to avoid stale redirects/caches
    location = /favicon.ico {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    location = /favicon.svg {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    index index.html;

    error_page 404 /404.html;

    location = /404.html {
      internal;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    location = /health {
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # This marker ships with the reviewed artifact. Keeping enforcement
    # artifact-gated prevents a config-only container restart from changing an
    # older active release before the reviewed release is promoted.
    location = /.reviewed-route-enforcement-v1 {
      internal;
    }

    # Only the reviewed publication cohort may serve city-specific HTML.
    location = /location/boston { return 301 /location/boston/; }
    location = /location/houston { return 301 /location/houston/; }
    location = /location/los-angeles { return 301 /location/los-angeles/; }
    location = /location/new-york { return 301 /location/new-york/; }
    location = /location/philadelphia { return 301 /location/philadelphia/; }
    location = /location/boston/ { try_files $uri/index.html =404; }
    location = /location/houston/ { try_files $uri/index.html =404; }
    location = /location/los-angeles/ { try_files $uri/index.html =404; }
    location = /location/new-york/ { try_files $uri/index.html =404; }
    location = /location/philadelphia/ { try_files $uri/index.html =404; }
    location ~ ^/location/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v1) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/location/[^/]+/?$ {
      if (-f $document_root/.reviewed-route-enforcement-v1) { return 404; }
      try_files $uri $uri/index.html =404;
    }

    # Only the reviewed publication cohort may serve provider-specific HTML.
    location = /appraiser/afp-art-consulting-llc-fine-art-consulting-appraisals-research-writing-and-collections-man { return 301 /appraiser/afp-art-consulting-llc-fine-art-consulting-appraisals-research-writing-and-collections-man/; }
    location = /appraiser/heidi-vaughan-ma-isa-am { return 301 /appraiser/heidi-vaughan-ma-isa-am/; }
    location = /appraiser/open-to-the-public { return 301 /appraiser/open-to-the-public/; }
    location = /appraiser/st-lifer-art-inc-international-art-appraiser { return 301 /appraiser/st-lifer-art-inc-international-art-appraiser/; }
    location = /appraiser/sarah-ann-wilson-art-services { return 301 /appraiser/sarah-ann-wilson-art-services/; }
    location = /appraiser/afp-art-consulting-llc-fine-art-consulting-appraisals-research-writing-and-collections-man/ { try_files $uri/index.html =404; }
    location = /appraiser/heidi-vaughan-ma-isa-am/ { try_files $uri/index.html =404; }
    location = /appraiser/open-to-the-public/ { try_files $uri/index.html =404; }
    location = /appraiser/st-lifer-art-inc-international-art-appraiser/ { try_files $uri/index.html =404; }
    location = /appraiser/sarah-ann-wilson-art-services/ { try_files $uri/index.html =404; }
    location ~ ^/appraiser/[^/]+/index\.html$ {
      if (-f $document_root/.reviewed-route-enforcement-v1) { return 404; }
      try_files $uri =404;
    }
    location ~ ^/appraiser/[^/]+/?$ {
      if (-f $document_root/.reviewed-route-enforcement-v1) { return 418; }
      try_files $uri $uri/index.html =404;
    }
    error_page 418 = @reviewed_provider_unavailable;
    location @reviewed_provider_unavailable {
      try_files /appraiser-unavailable.html =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    # Canonical provider aliases generated by the reviewed publication manifest.
    location = /appraiser/amelia-jeffers-auctioneers-appraisers/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/amelia-jeffers/; }
    location = /appraiser/appraiseitnow-louisiana/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/appraiseitnow/; }
    location = /appraiser/artifactual-history-appraisal/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/artifactual-history/; }
    location = /appraiser/boston-adelaide-fine-art/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/adelaide-fine-art/; }
    location = /appraiser/djr-authentication-lc/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/djr-authentication/; }
    location = /appraiser/escher-associates-nancy-escher/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/escher-associates-ea/; }
    location = /appraiser/fine-art-appraisals-new-york/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/kagan-fine-art-appraisals/; }
    location = /appraiser/philadelphia-art-of-estates-personal-property-appraisal-firm/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/art-of-estates-personal-property-appraisal-firm/; }
    location = /appraiser/prestige-estate-services-brenda-blackmon/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/prestige-estate-services/; }
    location = /appraiser/prestige-estate-services-elizabeth-lovett-stephanie-calman/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/prestige-estate-services/; }
    location = /appraiser/prestige-estate-services-national-network/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/prestige-estate-services/; }
    location = /appraiser/redtail-appraisals-rebekah-assid/ { return 301 https://art-appraisers-directory.appraisily.com/appraiser/redtail-appraisals/; }

    # Serve built assets directly; never rewrite to index.html
    location ^~ /assets/ {
      # If file doesn't exist, return 404 (do not fall back to index.html)
      try_files $uri =404;
      # Aggressive caching for hashed assets
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Some canonical assets intentionally live under this public prefix.
    location ^~ /directory/assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
      access_log off;
    }

    # Serve common static files directly
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|otf)$ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
      access_log off;
    }

    # Do not cache HTML documents to avoid stale index.html pointing to old chunk names
    location ~* \.html$ {
      try_files $uri =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # SPA fallback for application routes
    location / {
      try_files $uri $uri/index.html =404;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Cloudflare-CDN-Cache-Control "no-store" always;
      add_header cf-edge-cache "no-cache" always;
      add_header Pragma "no-cache" always;
      expires -1;
    }

    # Redirect WordPress content to resources subdomain
    location ^~ /wp-content/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Redirect WordPress admin to resources subdomain
    location ^~ /wp-admin/ {
      return 301 https://resources.appraisily.com$request_uri;
    }

    # Canonicalize singular to plural: /appraisal/<id> → https://appraisily.com/appraisals/<id>
    # Always emit the public HTTPS host to avoid leaking internal ports or schemes.
    location ~ ^/appraisal/([A-Za-z0-9-]+)/?$ {
      return 301 https://appraisily.com/appraisals/$1$is_args$args;
    }

    gzip on;
    gzip_types text/plain application/xml text/css text/javascript application/javascript application/json;
  }
}
